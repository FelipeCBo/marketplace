<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Zyra</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <header class="page-header">
      <h1>Seu carrinho</h1>
      <p id="qtd-itens">0 itens</p>
    </header>

    <main class="conteudo" style="padding-top:0">
      <div id="carrinho-container"></div>
      
      <div id="finalizar-box" style="display:none; margin-top: 24px;">
        <h2 style="font-size:18px; margin-bottom:16px;">Finalizar pedido</h2>
        <form id="form-pedido">
          <div class="input-group">
            <label>Endereço de entrega</label>
            <input type="text" id="endereco" required placeholder="Rua, número, bairro">
          </div>
          <h3 id="total" style="font-size:22px; margin-bottom:16px; font-weight:800; color: var(--roxo-zyra);">R$ 0,00</h3>
          <button type="submit" class="btn-primario">Confirmar Pedido</button>
        </form>
        <div id="msg" style="display:none;"></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Início
      </a>
      <a href="buscar.html">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Buscar
      </a>
      <a href="carrinho.html" class="ativo">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>Compras
      </a>
      <a href="cadastro.html">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Painel
      </a>
    </nav>
  </div>
  <script type="module" src="js/carrinho.js"></script>
</body>
</html>
